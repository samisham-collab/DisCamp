# Runs every check on each push and pull request. Free on GitHub for public
# repos, and within the free minutes for private ones.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  # Runs the real migration and seed against Postgres + PostGIS (the same
  # extensions Supabase uses) and reads spots back the way the app does.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: discamp
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DISCAMP_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/discamp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db

  # Type-checks and lints the Edge Functions, which run on Deno (Supabase's
  # runtime), not in the app.
  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/report-alert/index.ts supabase/functions/cleanup-push/index.ts supabase/functions/apple-revoke/index.ts
      - run: deno lint supabase/functions
