# GitHub Pages settings for DisCamp's website: the home page, and the support
# page, privacy policy and terms of use that the app and the App Store listing
# link to.
# Publish: GitHub repo > Settings > Pages > "Deploy from a branch", branch
# main, folder /docs. The site then lives at
# https://samisham-collab.github.io/DisCamp/ (the app's default).
#
# Fill these in before publishing. Every page uses them.
title: DisCamp
description: A free map of dispersed campsites that tells you whether your rig can reach and fit each one.
owner: Samuel Isham
support_email: '[your support email]'
state: Kansas
terms_effective: October 8, 2026
privacy_effective: October 16, 2026
repository_url: https://github.com/samisham-collab/DisCamp

# The folder the site is served from. Change it to '' if DisCamp moves to its
# own domain (a CNAME file in docs/), and set EXPO_PUBLIC_LEGAL_BASE_URL to match.
baseurl: /DisCamp

# Every page uses _layouts/default.html.
defaults:
  - scope:
      path: ''
    values:
      layout: default

markdown: kramdown
kramdown:
  input: GFM
